org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 migration: keep the classic DSL and the kotlin-android plugin for now. The KMP modules
# still use com.android.library; moving them to com.android.kotlin.multiplatform.library and
# built-in Kotlin can be done as its own change before AGP 10 removes these switches.
android.newDsl=false
android.builtInKotlin=false
kotlin.native.ignoreDisabledTargets=true
