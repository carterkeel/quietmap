# Generates iosApp.xcodeproj. The generated project is committed, so building only needs Xcode;
# after changing this file run `xcodegen` here (brew install xcodegen) and commit both.
name: iosApp
options:
  bundleIdPrefix: app.quietmap
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Quietmap:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quietmap
        PRODUCT_NAME: Quietmap
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        # The Gradle build phase writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework QuietmapUI -lc++"
        # The Kotlin code is built for Apple-silicon simulators only (iosSimulatorArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # Signing for a real phone: set your own team in Xcode (free accounts work for your own devices).
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Builds :ui's QuietmapUI framework for the current SDK and architecture.
          # Xcode doesn't inherit your shell, so find JDK 17 if JAVA_HOME isn't set.
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME="$(/usr/libexec/java_home -v 17 2>/dev/null)"
            [ -z "$JAVA_HOME" ] && [ -d /opt/homebrew/opt/openjdk@17 ] && JAVA_HOME=/opt/homebrew/opt/openjdk@17
            export JAVA_HOME
          fi
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
