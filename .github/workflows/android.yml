name: Android

on:
  push:
    branches-ignore: [ci-logs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Explicit bash turns on pipefail, so a failing Gradle command isn't hidden by `| tee`.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Test builds are signed with one long-lived key so each new APK installs over the last.
      # The key lives only in the Actions cache (never in the repo); it's for test builds only.
      - name: Restore the test signing key
        uses: actions/cache@v5
        with:
          path: ~/.quietmap-ci-key
          key: quietmap-ci-signing-v1

      - name: Create the test signing key if there isn't one yet
        run: |
          mkdir -p ~/.quietmap-ci-key
          if [ ! -f ~/.quietmap-ci-key/ci.jks ]; then
            keytool -genkeypair -keystore ~/.quietmap-ci-key/ci.jks -storetype PKCS12 \
              -storepass quietmap-ci -keypass quietmap-ci -alias quietmap-ci \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Quietmap test builds"
          fi
          echo "QUIETMAP_KEYSTORE=$HOME/.quietmap-ci-key/ci.jks" >> "$GITHUB_ENV"
          echo "QUIETMAP_KEYSTORE_PASSWORD=quietmap-ci" >> "$GITHUB_ENV"

      - name: Unit tests (crypto and protocol)
        run: ./gradlew :shared:testAndroidHostTest --stacktrace 2>&1 | tee test.log

      - name: Build debug and staging APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleStaging --stacktrace 2>&1 | tee build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: quietmap-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # Optimised build (R8, not debuggable): use this one to judge smoothness and battery.
      - name: Upload staging APK
        uses: actions/upload-artifact@v6
        with:
          name: quietmap-staging-apk
          path: androidApp/build/outputs/apk/staging/*.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the debug app on an emulator and runs the first-run smoke test (androidTest/).
      - name: UI smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./ci/emulator-test.sh

      # Publishes a plain-text summary of this run to the ci-logs branch, so build errors can be
      # read without opening the Actions UI. Contains only build output, never secrets.
      - name: Publish build log
        if: always()
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          out="$RUNNER_TEMP/ci-log"
          mkdir -p "$out"
          {
            echo "sha: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "status: $STATUS"
            echo
            for f in test.log build.log; do
              [ -f "$f" ] || continue
              echo "===== $f: errors ====="
              grep -nE "^e: |^w: .*deprecat|error:|FAILED|What went wrong|Could not|Exception|AssertionError|expected:" "$f" | head -200 || true
              echo
              echo "===== $f: tail ====="
              tail -n 150 "$f"
              echo
            done
            if [ -f emulator.log ]; then
              echo "===== emulator.log: errors ====="
              grep -nE "FAILED|Exception|AssertionError|What went wrong|tests completed" emulator.log | head -80 || true
              echo
            fi
            if [ -f logcat.txt ]; then
              echo "===== logcat: crashes ====="
              grep -n -A 45 "FATAL EXCEPTION" logcat.txt | head -200 || true
              echo
              echo "===== logcat: Quietmap and errors ====="
              grep -E " E/|Quietmap|AndroidRuntime|mbgl|[Mm]ap[Ll]ibre" logcat.txt | grep -viE "chatty|gralloc|EGL|OpenGL|cutils|netd|wifi|bluetooth|audio" | tail -80 || true
            fi
            for x in androidApp/build/outputs/androidTest-results/connected/**/*.xml androidApp/build/outputs/androidTest-results/connected/*.xml; do
              [ -f "$x" ] || continue
              if grep -q "<failure" "$x"; then echo "===== $x ====="; grep -A 40 "<failure" "$x" | head -120; fi
            done
            for x in shared/build/test-results/*/*.xml; do
              [ -f "$x" ] || continue
              if grep -q "<failure" "$x"; then echo "===== $x ====="; grep -A 15 "<failure" "$x" | head -120; fi
            done
          } > "$out/log.txt"
          cd "$out"
          git init -q -b ci-logs
          git add log.txt
          git -c user.name="quietmap-ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI log for $GITHUB_SHA ($STATUS)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
